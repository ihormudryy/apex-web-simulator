<!DOCTYPE HTML>
<html lang="en">
	<head>
		<title>Apex Web Simulator</title>
		<meta charset="utf-8">
		<style>
			body { background: #fff; margin: 0; overflow: hidden; }
		</style>
	</head>
	<body>
		<div id="container"></div>
		<script type="module">
		// WebGPURenderer must share the same `three` build as every Texture and
		// Material. Default is WebGPU; `?renderer=` overrides localStorage
		// (`apex-web-simulator.renderer`). Import map must load before modules.
		const CDN = 'https://cdn.jsdelivr.net/npm/three@0.185.1';
		const PREF_KEY = 'apex-web-simulator.renderer';
		const LEGACY_KEY = 'helloracer.renderer';
		const param = new URLSearchParams(location.search).get('renderer');
		let stored = null;
		try {
			stored = localStorage.getItem(PREF_KEY) ?? localStorage.getItem(LEGACY_KEY);
		} catch (_) { /* */ }
		const mode = (param === 'webgpu' || param === 'webgl')
			? param
			: (stored === 'webgpu' || stored === 'webgl') ? stored : 'webgpu';
		const webgpu = mode === 'webgpu';
		const importmap = {
			imports: {
				three: `${CDN}/build/${webgpu ? 'three.webgpu.js' : 'three.module.js'}`,
				'three/webgpu': `${CDN}/build/three.webgpu.js`,
				'three/tsl': `${CDN}/build/three.tsl.js`,
				'three/addons/': `${CDN}/examples/jsm/`,
			},
		};
		const el = document.createElement('script');
		el.type = 'importmap';
		el.textContent = JSON.stringify(importmap);
		document.head.appendChild(el);
		await import('./js/HelloRacer.js');
		</script>
	</body>
</html>
